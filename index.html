<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Hub</title>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: rgba(22, 27, 34, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --border-hover: #58a6ff;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent-glow: rgba(88, 166, 255, 0.15);
            --accent-blue: #58a6ff;
            --accent-cyan: #39c5bb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.3;
            z-index: -2;
        }

        .glow-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
            width: 100%;
            flex-grow: 1;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 2px solid var(--accent-blue);
            margin-bottom: 16px;
            display: none;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.15rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 24px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--border-hover);
            box-shadow: 0 10px 30px var(--accent-glow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .icon-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1.2rem;
            transition: color 0.2s;
        }

        .card:hover .icon-link {
            color: var(--accent-blue);
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tag {
            font-family: monospace;
            font-size: 0.75rem;
            background: rgba(88, 166, 255, 0.1);
            color: var(--accent-blue);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(88, 166, 255, 0.2);
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 40px;
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="glow-orb"></div>

    <div class="container">
        <header>
            <img id="userAvatar" class="avatar" alt="GitHub Profile Picture">
            <h1 id="userName">Loading Name...</h1>
            <p id="userBio" class="subtitle">Fetching profile details from GitHub...</p>
        </header>

        <main class="project-grid" id="projectGrid">
            <div class="loading">Loading repositories...</div>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 | Powered by GitHub API</p>
    </footer>

    <script>
        // Set this to your exact GitHub username
        const GITHUB_USERNAME = "untitledmehappyface";
        async function fetchGitHubData() {
            try {
                // Fetch User Profile
                const userRes = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}`);
                const userData = await userRes.json();

                // Set Name & Bio (falls back to username if display name isn't set)
                document.getElementById('userName').innerText = userData.name || userData.login;
                document.getElementById('userBio').innerText = userData.bio || "Custom software builds, systems code, and personal tools.";
                
                if (userData.avatar_url) {
                    const avatarImg = document.getElementById('userAvatar');
                    avatarImg.src = userData.avatar_url;
                    avatarImg.style.display = 'inline-block';
                }

                // Fetch Public Repositories
                const reposRes = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&per_page=12`);
                const repos = await reposRes.json();

                const grid = document.getElementById('projectGrid');
                grid.innerHTML = ''; // Clear loading indicator

                // Filter out forks if you only want your own projects
                const publicRepos = repos.filter(repo => !repo.fork);

                if (publicRepos.length === 0) {
                    grid.innerHTML = '<div class="loading">No public repositories found.</div>';
                    return;
                }

                publicRepos.forEach(repo => {
                    const card = document.createElement('article');
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <div class="card-header">
                                <h2 class="card-title">${repo.name}</h2>
                                <a href="${repo.html_url}" class="icon-link" target="_blank" title="View Repository">↗</a>
                            </div>
                            <p class="card-desc">${repo.description || "No description provided."}</p>
                        </div>
                        <div class="card-footer">
                            <span class="tag">${repo.language || "Plain Text"}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error("Error fetching GitHub data:", error);
                document.getElementById('userName').innerText = "Developer Hub";
                document.getElementById('userBio').innerText = "Failed to load GitHub data.";
                document.getElementById('projectGrid').innerHTML = '<div class="loading">Unable to fetch projects right now.</div>';
            }
        }

        fetchGitHubData();
    </script>
</body>
</html>
